name: DocuMind CI

on:
  push:
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py rag_engine.py evaluate_rag.py make_user_hash.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v